name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build SquoraForms.sln -c Release
      - run: dotnet test SquoraForms.sln -c Release --no-build
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  editor-e2e:
    # drives the editor of the sample app with real mouse input in Chromium: drag and drop, selection, the
    # property pane, once for each UI library. It takes a while, so it runs when something is merged to main, not on every pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tst/editor-e2e
    env:
      APP_URL: http://localhost:5199/
      APP_LOG: ${{ github.workspace }}/tst/editor-e2e/app.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet publish ../../samples/MudBlazorServerApp -c Release -o ${{ github.workspace }}/app
        working-directory: ${{ github.workspace }}
      - name: Start the sample app
        run: |
          cd ${{ github.workspace }}/app
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5199 nohup dotnet MudBlazorServerApp.dll > "$APP_LOG" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null "$APP_URL" && exit 0; sleep 1; done
          cat "$APP_LOG"; exit 1
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Screenshots and app log of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-failure
          path: |
            tst/editor-e2e/out
            tst/editor-e2e/app.log
