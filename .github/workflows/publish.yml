name: Publish NuGet packages
# Create a GitHub release tagged vX.Y.Z (or vX.Y.Z-preview.N) to publish.
on:
  release:
    types: [published]
jobs:
  publish:
    # NuGet releases use tags like v1.2.3; npm releases use react-v1.2.3 (see publish-npm.yml)
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for NuGet Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Compute version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build SquoraForms.sln -c Release /p:Version=$VERSION
      - run: dotnet test SquoraForms.sln -c Release --no-build
      - run: dotnet pack SquoraForms.sln -c Release --no-build /p:Version=$VERSION -o artifacts
      # Exchange the GitHub OIDC token for a short-lived NuGet API key (no stored secret)
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name (not email)
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
